<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Histogramme météo Paris</title>

  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }
    #chart {
      width: 100%;
      height: 500px;
    }
  </style>
</head>

<body>
  <h2>Températures Paris - Histogramme</h2>

  <div id="chart"></div>

  <script>
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(loadData);

    async function loadData() {
      const res = await fetch('/paris');
      const data = await res.json();

      const rows = data.map(p => [p.datetime, Number(p.temperature_c)]);

      drawChart(rows);
    }

    function drawChart(rows) {
      const data = new google.visualization.DataTable();
      data.addColumn('string', 'Date');
      data.addColumn('number', 'Température');

      data.addRows(rows);

      const options = {
        title: 'Températures sur 7 jours',
        legend: { position: 'none' },
        hAxis: { title: 'Date' },
        vAxis: { title: '°C' },
        bar: { groupWidth: '70%' }
      };

      const chart = new google.visualization.ColumnChart(
        document.getElementById('chart')
      );

      chart.draw(data, options);
    }
  </script>
</body>
</html>
